name: Deploy to GitHub Pages

on:
  workflow_dispatch: # 允許手動執行
  push:
    branches:
      # 不想每次小改都觸發 GitHub Actions ，故移除 branches:[ main, master ] ，若保留這個設定，則可在 commit 時加入 [skip ci]、[ci skip]、[skip actions]、[actions skip]、[no ci] 等關鍵字來跳過當次執行，例如： git commit -m "小改版文字修正 [skip ci]"
      - 'release/*' # 只有當 push 到 release/ 開頭的分支才執行
    paths-ignore: # 忽略以下檔案的變更，不觸發 GitHub Actions
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm build
        env:
          # 禁用 Analytics（GitHub Pages 版本）
          NEXT_PUBLIC_ENABLE_ANALYTICS: false

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
